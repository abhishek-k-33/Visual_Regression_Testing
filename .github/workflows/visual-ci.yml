name: Visual Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Test Suite
        run: npm test

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest

    steps:
      # Baselines are committed in storage/baselines/, so the checkout brings in
      # exactly the baselines approved for this commit.
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Demo Site
        run: node scripts/serve-demo.js > demo-site.log 2>&1 &

      # This repository's own action (action.yml): builds the Docker image that also
      # creates the baselines (npm run docker:update-baselines), so fonts and rendering
      # match pixel for pixel, runs `visual-ci test --strict` in it (a missing baseline
      # fails the job), writes the step summary and uploads this run's folder as the
      # visual-regression-diffs artifact when the check fails.
      - name: Visual Regression Check
        id: visual
        uses: ./
        with:
          base-url: http://127.0.0.1:4567
          wait-on: http://127.0.0.1:4567/
          wait-timeout: 30
          artifact-name: visual-regression-diffs
          upload-artifact: on-failure
          retention-days: 7

      - name: Show Demo Site Log
        if: failure()
        run: cat demo-site.log || true
