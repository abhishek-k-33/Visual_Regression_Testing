name: Visual Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Test Suite
        run: npm test

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest

    steps:
      # Baselines are committed in storage/baselines/, so the checkout brings in
      # exactly the baselines approved for this commit.
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same image used to create the baselines (npm run docker:update-baselines),
      # so fonts and rendering match pixel for pixel.
      - name: Build Visual Test Image
        run: docker build -t visual-ci .

      - name: Start Demo Site
        run: |
          node scripts/serve-demo.js > demo-site.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4567/ > /dev/null && exit 0
            sleep 1
          done
          cat demo-site.log
          exit 1

      # --strict: a missing baseline fails the job instead of being created.
      - name: Run Visual Regression Tests
        run: |
          docker run --rm --network host \
            -e CI=true -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_HEAD_REF \
            -e GITHUB_STEP_SUMMARY=/tmp/step-summary.md \
            -v "$GITHUB_STEP_SUMMARY:/tmp/step-summary.md" \
            -v "$PWD/storage:/app/storage" \
            -v "$PWD/visual.config.json:/app/visual.config.json:ro" \
            visual-ci node src/cli/index.js test --strict

      - name: Upload Diff Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: storage/runs/
          retention-days: 7
          if-no-files-found: ignore
