# Proves the action's failure paths on a real runner: a run with visual differences
# uploads an artifact that `visual-ci import` accepts, and a run that cannot reach its
# app reports an error and uploads nothing, and (on pull requests from this repository)
# a run with differences comments on the pull request. The checks pass only when the action fails
# the way it should (continue-on-error on the action step, assertions after it).
#
# Never writes baselines: strict compare mode (the default), no update-baselines, a
# read-only token (the comment job may only write pull request comments), no persisted
# git credentials, and a step that fails if storage/baselines changed. The diff and error
# jobs never comment (comment: false) and assert that the comment step did not run; the
# comment job proves that it does.
name: Action Self-Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - action.yml
      - 'src/ci/**'
      - 'src/cli/**'
      - 'src/shared/**'
      - Dockerfile
      - .dockerignore
      - .github/workflows/action-selftest.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff:
    name: Diff run uploads an importable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: read lets gh list and download this run's artifacts. Job permissions
    # replace the workflow's, so contents: read is repeated.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The regressed page differs from the committed baselines (red heading, moved
      # button): 1.6% on desktop and 7% on mobile, above the 1% threshold.
      - name: Start Demo Site (regressed variant)
        run: DEMO_VARIANT=regressed node scripts/serve-demo.js > demo-site.log 2>&1 &

      - name: Visual Check (expected to find differences)
        id: visual
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:4567
          wait-on: http://127.0.0.1:4567/
          wait-timeout: 30
          upload-artifact: always
          artifact-name: selftest-diff-${{ github.run_attempt }}
          retention-days: 1
          comment: false

      - name: Assert the Outputs of a Diff Run
        env:
          OUTCOME: ${{ steps.visual.outcome }}
          STATUS: ${{ steps.visual.outputs.status }}
          EXIT_CODE: ${{ steps.visual.outputs.exit-code }}
          CHANGED: ${{ steps.visual.outputs.changed }}
          ARTIFACT_NAME: ${{ steps.visual.outputs.artifact-name }}
          ARTIFACT_ID: ${{ steps.visual.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.visual.outputs.artifact-url }}
          COMMENT_ACTION: ${{ steps.visual.outputs.comment-action }}
          EXPECTED_ARTIFACT_NAME: selftest-diff-${{ github.run_attempt }}
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "ok: $1 = $2"; else echo "::error title=self-test::$1: expected '$3', got '$2'"; fail=1; fi
          }
          check "action step outcome" "$OUTCOME" failure
          check status "$STATUS" failed
          check exit-code "$EXIT_CODE" 1
          check artifact-name "$ARTIFACT_NAME" "$EXPECTED_ARTIFACT_NAME"
          check comment-action "$COMMENT_ACTION" ""
          if [[ "$CHANGED" =~ ^[0-9]+$ ]] && [ "$CHANGED" -ge 1 ]; then echo "ok: changed = $CHANGED"; else echo "::error title=self-test::changed: expected at least 1, got '$CHANGED'"; fail=1; fi
          if [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then echo "ok: artifact-id = $ARTIFACT_ID"; else echo "::error title=self-test::artifact-id: expected a number, got '$ARTIFACT_ID'"; fail=1; fi
          if [[ "$ARTIFACT_URL" == https://* ]]; then echo "ok: artifact-url = $ARTIFACT_URL"; else echo "::error title=self-test::artifact-url: expected an https URL, got '$ARTIFACT_URL'"; fail=1; fi
          exit "$fail"

      # By name (checked against the expected name above, and again here: an empty name
      # would download every artifact of the run). A just-uploaded artifact is not always
      # found yet within the same run: download-artifact failed 140 ms after the upload
      # finished (run 45761556091, by name; run 45670878311, by id), so retry with backoff.
      - name: Download the Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.visual.outputs.artifact-name }}
          ARTIFACT_DIR: ${{ runner.temp }}/selftest-artifact
        run: |
          if ! [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-][A-Za-z0-9._\ -]{0,99}$ ]]; then
            echo "::error title=self-test::no valid artifact name to download"
            exit 1
          fi
          for delay in 2 4 8 16 32 0; do
            rm -rf -- "$ARTIFACT_DIR"
            if gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D "$ARTIFACT_DIR"; then
              echo "Downloaded the artifact."
              exit 0
            fi
            [ "$delay" -eq 0 ] && break
            echo "The artifact is not available yet; retrying in ${delay}s."
            sleep "$delay"
          done
          echo "::error title=self-test::the artifact could not be downloaded after 6 attempts"
          exit 1

      - name: Install Dependencies for visual-ci import
        run: npm ci --omit=dev

      - name: Import the Artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/selftest-artifact
        run: |
          if [ ! -f "$ARTIFACT_DIR/run.json" ]; then
            echo "::error title=self-test::run.json is not at the root of the artifact"
            ls -laR "$ARTIFACT_DIR"
            exit 1
          fi
          # A throwaway storage folder: never the checkout's storage/.
          export VISUAL_STORAGE_DIR="$RUNNER_TEMP/selftest-import-storage"
          node src/cli/index.js import "$ARTIFACT_DIR" | tee "$RUNNER_TEMP/import.log"
          if ! grep -q "Imported 1 run" "$RUNNER_TEMP/import.log"; then
            echo "::error title=self-test::visual-ci import did not import the run"
            exit 1
          fi

      - name: Committed Baselines Are Untouched
        if: always()
        run: |
          changes="$(git status --porcelain -- storage/baselines)"
          if [ -n "$changes" ]; then
            echo "::error title=self-test::storage/baselines changed:"
            echo "$changes"
            exit 1
          fi

      - name: Show Demo Site Log
        if: failure()
        run: cat demo-site.log || true

  error:
    name: Error run reports exit 2 and uploads nothing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Nothing listens on port 9 (discard): the first page load fails, before any
      # screenshot, so the run folder stays empty and is not uploaded, even with always.
      - name: Visual Check (expected to fail with an error)
        id: visual
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:9/
          upload-artifact: always
          artifact-name: selftest-error-${{ github.run_attempt }}
          retention-days: 1
          comment: false

      - name: Assert the Outputs of an Error Run
        env:
          OUTCOME: ${{ steps.visual.outcome }}
          STATUS: ${{ steps.visual.outputs.status }}
          EXIT_CODE: ${{ steps.visual.outputs.exit-code }}
          ARTIFACT_NAME: ${{ steps.visual.outputs.artifact-name }}
          ARTIFACT_ID: ${{ steps.visual.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.visual.outputs.artifact-url }}
          COMMENT_ACTION: ${{ steps.visual.outputs.comment-action }}
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "ok: $1 = '$2'"; else echo "::error title=self-test::$1: expected '$3', got '$2'"; fail=1; fi
          }
          check "action step outcome" "$OUTCOME" failure
          check status "$STATUS" error
          check exit-code "$EXIT_CODE" 2
          check artifact-name "$ARTIFACT_NAME" ""
          check artifact-id "$ARTIFACT_ID" ""
          check artifact-url "$ARTIFACT_URL" ""
          check comment-action "$COMMENT_ACTION" ""
          exit "$fail"

      - name: Committed Baselines Are Untouched
        if: always()
        run: |
          changes="$(git status --porcelain -- storage/baselines)"
          if [ -n "$changes" ]; then
            echo "::error title=self-test::storage/baselines changed:"
            echo "$changes"
            exit 1
          fi

  # Live proof of the comment's create/update path on a real runner: posts one sticky
  # comment (comment-id "selftest", named in its headline) on pull requests that touch
  # the action, and updates it on later pushes. Same-repository pull requests only: a
  # fork's token can't write comments. The only job here with a write permission.
  comment:
    name: Diff run comments on the pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job permissions replace the workflow's, so contents: read is repeated.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Demo Site (regressed variant)
        run: DEMO_VARIANT=regressed node scripts/serve-demo.js > demo-site.log 2>&1 &

      - name: Visual Check (expected to comment)
        id: visual
        continue-on-error: true
        uses: ./
        with:
          base-url: http://127.0.0.1:4567
          wait-on: http://127.0.0.1:4567/
          wait-timeout: 30
          upload-artifact: never
          artifact-name: selftest-comment-${{ github.run_attempt }}
          comment-id: selftest

      - name: Assert the Outputs of a Commented Run
        env:
          OUTCOME: ${{ steps.visual.outcome }}
          STATUS: ${{ steps.visual.outputs.status }}
          EXIT_CODE: ${{ steps.visual.outputs.exit-code }}
          COMMENT_ACTION: ${{ steps.visual.outputs.comment-action }}
          COMMENT_URL: ${{ steps.visual.outputs.comment-url }}
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "ok: $1 = $2"; else echo "::error title=self-test::$1: expected '$3', got '$2'"; fail=1; fi
          }
          check "action step outcome" "$OUTCOME" failure
          check status "$STATUS" failed
          check exit-code "$EXIT_CODE" 1
          case "$COMMENT_ACTION" in
            created|updated) echo "ok: comment-action = $COMMENT_ACTION" ;;
            *) echo "::error title=self-test::comment-action: expected created or updated, got '$COMMENT_ACTION' (see the action's warnings)"; fail=1 ;;
          esac
          if [[ "$COMMENT_URL" == https://* ]]; then echo "ok: comment-url = $COMMENT_URL"; else echo "::error title=self-test::comment-url: expected an https URL, got '$COMMENT_URL'"; fail=1; fi
          exit "$fail"

      - name: Committed Baselines Are Untouched
        if: always()
        run: |
          changes="$(git status --porcelain -- storage/baselines)"
          if [ -n "$changes" ]; then
            echo "::error title=self-test::storage/baselines changed:"
            echo "$changes"
            exit 1
          fi

      - name: Show Demo Site Log
        if: failure()
        run: cat demo-site.log || true
