# ==============================================================================
# Visual Regression Testing & Review Dashboard - Docker Compose Specification
# ==============================================================================

services:
  # Service 1: Web Review Dashboard & REST API
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visual-ci-dashboard
    restart: unless-stopped
    ports:
      # Published on the host loopback only; change to "4000:4000" to expose on your network
      # (if you then browse to it by hostname rather than IP, add ALLOWED_HOSTS=<hostname> below)
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      # Mount host storage directory for baseline images, test runs, and SQLite DB
      - ./storage:/app/storage
      # Live config, so the dashboard and runner agree on storageDir
      - ./visual.config.json:/app/visual.config.json:ro

  # Service 2: Visual Regression Test Runner CLI
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visual-ci-runner
    command: ["node", "src/cli/index.js", "test"]
    environment:
      - NODE_ENV=production
    volumes:
      # Share storage directory and live config with host
      - ./storage:/app/storage
      - ./visual.config.json:/app/visual.config.json:ro
    # Host networking enables capturing web apps running on http://localhost:<port> on the host
    network_mode: "host"
